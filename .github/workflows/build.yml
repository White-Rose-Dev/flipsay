name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python -m pip install --upgrade ufbt

      - name: Select Momentum dev SDK
        run: ufbt update --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=dev

      - name: Build FAP
        run: ufbt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipsay-fap
          path: dist/flipsay.fap

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/flipsay.fap
          body_path: release/RELEASE_NOTES.md

  bridge-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/flipsay_sdr_bridge.py --selftest
