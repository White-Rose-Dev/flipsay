name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fw: momentum
            index: https://up.momentum-fw.dev/firmware/directory.json
            channel: dev
          - fw: unleashed
            index: https://up.unleashedflip.com/directory.json
            channel: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python -m pip install --upgrade ufbt

      - name: Select ${{ matrix.fw }} SDK
        run: ufbt update --index-url=${{ matrix.index }} --channel=${{ matrix.channel }}

      - name: Build FAP
        run: ufbt

      - name: Name the file after the firmware
        run: mv dist/flipsay.fap dist/flipsay-${{ matrix.fw }}.fap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipsay-${{ matrix.fw }}
          path: dist/flipsay-${{ matrix.fw }}.fap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: flipsay-*
          merge-multiple: true
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.fap
          body_path: release/RELEASE_NOTES.md

  bridge-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/flipsay_sdr_bridge.py --selftest
